# Checks every push to dev and main and every pull request to them: the Go code (format, vet, unit tests, builds for
# the three platforms), the mod (validation and unit tests, with the Claude Code version it's tested with) and the pages
# in a real browser. The commit messages are history.yml's, which docs-only changes don't skip. It uses no secrets and
# its token can only read, so pull requests from forks get the same checks. TestOffice and TestModStartsBridge start
# real Claude sessions and spend tokens, so they run on a developer's machine only (see CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [dev, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [dev, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./... && go vet -tags e2e ./e2e/
      - name: Unit tests (catalogs included)
        run: go test -race ./...
      - name: Builds for Windows, macOS and Linux
        run: |
          for os in windows darwin linux; do
            GOOS=$os go vet ./internal/... ./cmd/...
            GOOS=$os go build -o /dev/null ./cmd/bridge
          done

  mod:
    name: Mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_VERSION: 2.1.316 # the version the mod is tested with, as CLAUDE.md says; bump both together
    steps:
      - uses: actions/checkout@v7
      - name: Cache Claude Code
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/claude
            ~/.local/bin/claude
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}
      - name: Install Claude Code
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the marketplace and the mod
        run: |
          claude --version
          claude plugin validate .
          claude plugin validate mods/symphony-bridge
      - name: Mod unit tests
        run: claude plugin test mods/symphony-bridge

  pages:
    name: Pages in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: TestI18n, TestIdle, TestLayout, TestAsksDock, TestTask, TestScreens, TestThemesLoad, TestHQ, TestMessenger, TestMission and TestReconnect with Chrome (no tokens)
        run: go test -tags e2e -count=1 -v -run 'TestI18n|TestIdle|TestLayout|TestAsksDock|TestTask$|TestScreens|TestThemesLoad|TestHQ|TestMessenger|TestMission|TestReconnect|TestContrast|TestNarrow|TestA11y' ./e2e/
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: e2e/artifacts/
          retention-days: 7
