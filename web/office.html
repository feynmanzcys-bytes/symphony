<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="office.title">Symphony Office</title>
<style>
  html, body { margin:0; height:100%; background:#2f2e2b; color:#f2efe8; font:13px/1.45 system-ui, sans-serif; overflow:hidden; }
  /* CJK fonts per language, so each gets its own glyph forms */
  body:lang(zh-CN) { font-family:system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  body:lang(zh-TW) { font-family:system-ui, "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif; }
  body:lang(ja) { font-family:system-ui, "Hiragino Sans", "Yu Gothic UI", "Noto Sans CJK JP", sans-serif; }
  body:lang(ko) { font-family:system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", sans-serif; }
  canvas#office { position:fixed; inset:0; width:100vw; height:100vh; image-rendering:pixelated; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  #hud { position:fixed; top:10px; left:10px; z-index:3; background:rgba(47,46,43,.88); padding:6px 10px 8px; }
  #hud h1 { margin:0; font-size:14px; font-weight:700; }
  #hud .stats { margin-top:2px; color:#c9c4ba; }
  #hud .btns { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  #hud select.lang { font:inherit; font-size:12px; background:#fffdf7; color:#2b2a28; border:2px solid #2b2a28; padding:0 2px; cursor:pointer; }
  #hud .note { margin-top:6px; max-width:420px; color:#f0c674; line-height:1.5; }
  /* the search box, beside the title: matches show in a list below it, the rest of the office dims */
  #hud .top { display:flex; align-items:center; gap:10px; }
  #hud .find { position:relative; }
  #find { width:210px; box-sizing:border-box; font:inherit; font-size:12px; background:#fffdf7; color:#2b2a28; border:2px solid #2b2a28;
    padding:2px 6px; box-shadow:2px 2px 0 rgba(0,0,0,.3); }
  #find:focus { outline:none; border-color:#f2b705; }
  #find-list { position:absolute; z-index:1; left:0; top:calc(100% + 4px); min-width:240px; max-width:380px; background:#fffdf7; color:#2b2a28;
    border:2px solid #2b2a28; box-shadow:4px 4px 0 rgba(0,0,0,.35); }
  #find-list[hidden] { display:none; }
  #find-list .hit { padding:2px 8px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #find-list .hit.on { background:#f2b705; }
  #find-list .hit small { color:#6f6b64; margin-left:8px; }
  #find-list .none { padding:2px 8px; color:#8a867e; }
  #hud .note code { display:block; margin-top:2px; padding:2px 6px; background:#1f1e1c; color:#fffdf7; user-select:all; word-break:break-all; }
  #log { position:fixed; left:16px; bottom:12px; z-index:3; font:12px/1.6 ui-monospace, monospace; color:#a9a49b; max-width:min(560px, calc(100vw - 32px)); pointer-events:none; }
  #log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { display:inline-block; width:8px; height:8px; margin-right:4px; vertical-align:0; }
  #hud .stats .dot { margin-left:8px; }
  #hud .stats .dot:first-child { margin-left:0; }
  button.px { background:#fffdf7; color:#2b2a28; border:2px solid #2b2a28; padding:2px 10px; font:inherit; cursor:pointer; box-shadow:2px 2px 0 rgba(0,0,0,.3); }
  button.px.primary { background:#2b2a28; color:#fffdf7; }
  button.px.alert { background:#d64541; color:#fff; border-color:#7a1f1c; }
  button.px:disabled { opacity:.5; cursor:default; }
  /* name tags above the characters */
  .emp-label { position:absolute; transform:translate(-50%, -100%); pointer-events:auto; cursor:pointer; background:#fffdf7; color:#2b2a28;
    border:2px solid #2b2a28; border-left-width:5px; padding:0 6px; font-size:11px; line-height:1.35; white-space:nowrap; text-align:center;
    box-shadow:2px 2px 0 rgba(0,0,0,.3); }
  .emp-label { box-sizing:border-box; } /* no wider than a desk (set in placeLabels); longer text ends in … and shows in full on hover */
  .emp-label .nm, .emp-label .st { overflow:hidden; text-overflow:ellipsis; }
  .emp-label .nm { font-weight:700; font-size:12px; }
  .emp-label .st { color:#6f6b64; }
  .emp-label.off { opacity:.55; }
  .emp-label.away .st { display:none; } /* away from the desk: the name only, so a sofa full of people stays readable */
  .emp-label.dim { opacity:.25; }
  .emp-label.match { outline:2px solid #f2b705; outline-offset:1px; }
  .emp-label.found { animation:found .4s steps(1) 8; }
  @keyframes found { 50% { background:#f2b705; } }
  .room-label { position:absolute; background:rgba(43,42,40,.82); color:#fffdf7; padding:0 6px; font-size:11px; line-height:1.6; letter-spacing:1px; white-space:nowrap; }
  .sign-text { position:absolute; transform:translate(-50%, -50%); color:#fffdf7; font:700 13px/1 ui-monospace, monospace; letter-spacing:3px; white-space:nowrap; }
  .seat-add { position:absolute; transform:translate(-50%, -50%); pointer-events:auto; cursor:pointer; width:22px; height:22px; padding:0;
    background:#fffdf7; color:#2b2a28; border:2px solid #2b2a28; font:700 16px/16px ui-monospace, monospace; box-shadow:2px 2px 0 rgba(0,0,0,.3); }
  .seat-add:hover { background:#f2b705; }
  .bubble { position:absolute; transform:translate(-50%, calc(-100% - 36px)); background:#fffdf7; color:#2b2a28; border:2px solid #2b2a28;
    padding:1px 6px; font-size:12px; max-width:220px; box-shadow:2px 2px 0 rgba(0,0,0,.3); }
  .bubble b { font-weight:700; }
  /* popups */
  .modal { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  .modal[hidden] { display:none; }
  .panel { width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; background:#fffdf7; color:#2b2a28;
    border:2px solid #2b2a28; box-shadow:4px 4px 0 rgba(0,0,0,.35); padding:14px 16px; box-sizing:border-box; }
  .panel h2 { margin:0 0 10px; font-size:15px; }
  .panel .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
  /* pending cards (built by asks.js) */
  #asks .card { border:2px solid #2b2a28; padding:10px 12px; margin-bottom:10px; background:#fff; }
  #asks .who { display:flex; gap:8px; align-items:baseline; margin-bottom:6px; }
  #asks .who .name { font-weight:700; }
  #asks .who .kind, #asks .meta { color:#8a867e; font-size:12px; }
  #asks .tool { font:700 13px ui-monospace, monospace; }
  #asks pre { background:#f2efe8; border:1px solid #d6d1c6; padding:6px 8px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all; font-size:12px; margin:6px 0; }
  #asks .row { display:flex; gap:8px; align-items:center; margin-top:6px; }
  #asks .row input { flex:1; }
  #asks input[type=text] { border:2px solid #2b2a28; padding:3px 6px; font:inherit; background:#fff; color:#2b2a28; }
  #asks button { border:2px solid #2b2a28; background:#fffdf7; padding:2px 12px; font:inherit; cursor:pointer; }
  #asks button.allow, #asks button.submit { background:#2b2a28; color:#fffdf7; }
  #asks .q h3 { margin:4px 0; font-size:14px; } #asks .q .hd { color:#8a867e; font-weight:400; font-size:12px; margin-right:6px; }
  #asks label.opt { display:block; cursor:pointer; padding:1px 0; } #asks label.opt small { color:#8a867e; margin-left:6px; }
  #asks .q input.other { display:block; width:100%; box-sizing:border-box; margin-top:4px; }
  /* launch dialog */
  #launch label { display:block; margin:8px 0 2px; font-size:12px; color:#6f6b64; }
  #launch input, #launch select { width:100%; box-sizing:border-box; font:inherit; color:#2b2a28; background:#fff; border:2px solid #2b2a28; padding:3px 6px; }
  #launch input[readonly] { background:#ece8df; }
  #launch .row { display:flex; gap:6px; }
  #launch .row input { flex:1; }
  #launch .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  #launch .browser { border:2px solid #2b2a28; margin-top:6px; background:#fff; }
  #launch .browser .cur { padding:3px 6px; background:#ece8df; font:12px ui-monospace, monospace; word-break:break-all; }
  #launch .browser ul { list-style:none; margin:0; padding:0; max-height:180px; overflow:auto; }
  #launch .browser li { padding:2px 8px; cursor:pointer; font-size:13px; }
  #launch .browser li:hover { background:#f2b705; }
  #launch .browser .pick { margin:6px; }
  #launch .recent { margin-top:4px; display:flex; flex-wrap:wrap; gap:4px; }
  #launch .recent span { font:11px ui-monospace, monospace; border:1px solid #b9b3a8; padding:0 5px; cursor:pointer; }
  #launch pre { margin:10px 0 0; padding:6px 8px; background:#2b2a28; color:#f2efe8; font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  #launch .status { margin-top:8px; font-size:12px; white-space:pre-wrap; }
  #launch .status.err { color:#c0392b; }
  /* employee card and message log: side panels */
  .side { position:fixed; right:12px; top:12px; bottom:12px; z-index:5; width:min(340px, calc(100vw - 24px)); overflow:auto; background:#fffdf7; color:#2b2a28;
    border:2px solid #2b2a28; box-shadow:4px 4px 0 rgba(0,0,0,.35); padding:10px 12px; box-sizing:border-box; }
  .side[hidden] { display:none; }
  .side h2 { margin:0 0 6px; font-size:15px; }
  .side .close { position:absolute; right:8px; top:4px; cursor:pointer; color:#8a867e; }
  .side dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px; }
  .side dt { color:#8a867e; } .side dd { margin:0; word-break:break-all; }
  .side .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .msg { border-bottom:1px dashed #d6d1c6; padding:5px 0; font-size:12px; }
  .msg .meta { color:#8a867e; font-size:11px; }
  .msg .meta b { color:#2b2a28; }
  .msg .lost { color:#c0392b; }
  .side h3 { font-size:13px; margin:12px 0 4px; }
</style>
</head>
<body>
<canvas id="office"></canvas>
<div id="labels"></div>
<div id="hud">
  <div class="top"><h1 data-i18n="office.title"></h1>
    <div class="find"><input id="find" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder" data-i18n-title="search.title"><div id="find-list" hidden></div></div></div>
  <div class="stats" id="stats" data-i18n="office.nobody"></div>
  <div class="btns">
    <button class="px alert" id="open-asks" hidden></button>
    <button class="px" id="open-msgs" data-i18n="office.messages"></button>
    <button class="px" id="new-emp" data-i18n="office.newEmployee" hidden></button>
  </div>
  <div class="note" id="launch-note" hidden></div>
</div>
<div id="log"></div>

<div class="modal" id="asks-modal" hidden>
  <div class="panel">
    <h2 id="asks-title"></h2>
    <div id="asks"></div>
    <div class="actions"><button class="px" id="asks-later" data-i18n="asks.later"></button></div>
  </div>
</div>

<div class="modal" id="launch" hidden>
  <form class="panel" autocomplete="off">
    <h2 class="title"></h2>
    <label data-i18n="launch.name"></label>
    <input name="name" data-i18n-placeholder="launch.namePlaceholder" required>
    <label data-i18n="launch.dir"></label>
    <div class="row"><input name="dir" data-i18n-placeholder="launch.dirPlaceholder" required><button type="button" class="px browse" data-i18n="launch.browse"></button></div>
    <div class="browser" hidden><div class="cur"></div><ul></ul><button type="button" class="px pick" data-i18n="launch.pick"></button></div>
    <div class="recent"></div>
    <div class="grid">
      <div><label data-i18n="launch.model"></label><select name="model"></select></div>
      <div><label data-i18n="launch.effort"></label><select name="effort"></select></div>
      <div><label data-i18n="launch.permissionMode"></label><select name="permissionMode"></select></div>
      <div><label data-i18n="launch.resume"></label><select name="resume"></select></div>
    </div>
    <pre class="preview"></pre>
    <div class="status"></div>
    <div class="actions"><button type="button" class="px cancel" data-i18n="common.cancel"></button><button type="submit" class="px primary go" data-i18n="launch.go"></button></div>
  </form>
</div>

<div class="side" id="card" hidden><span class="close">✕</span><h2></h2><dl></dl><div class="btns"></div><h3 data-i18n="card.recentMessages"></h3><div class="msgs"></div></div>
<div class="side" id="msgs-panel" hidden><span class="close">✕</span><h2 data-i18n="office.messages"></h2><div class="msgs"></div></div>

<script type="module">
import { t, lang, errorText, fmtTime, applyI18n, langPicker } from '/i18n.js'
import { esc, syncCards } from '/asks.js'

applyI18n()
document.querySelector('#hud .btns').appendChild(langPicker())

// ================= constants =================
const T = 16 // one tile is 16 pixels
const GREEN = '#2e9e5b', YELLOW = '#f2b705', RED = '#d64541', GRAY = '#a9a49b'
// three state colors: idle green, working yellow, waiting for an approval or an answer red; off duty gray
const STATE_COLOR = { idle:GREEN, thinking:YELLOW, tool:YELLOW, waiting:RED, ended:GRAY, done:GRAY }
const COLS = 6, COL_PITCH = 3 * T, ROW_PITCH = 4 * T, WALL_H = 3 * T, AISLE = 24, LABEL_ROOM = 2 * T + 10
const CLAWD = '#d97757', CLAWD_SHADE = '#b9603f', EYE = '#2b1b14', MINI = '#e6a58d', MINI_SHADE = '#c98a72'
const OFF = '#3b3e44' // laptop light of an empty desk

const rect = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h) }
const base = p => (p || '').split(/[\\/]/).filter(Boolean).pop() || p || '?' // Windows paths use backslashes
const dot = state => `<span class="dot" style="background:${STATE_COLOR[state] ?? GRAY}"></span>`
const hash = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7) >>> 0

let snapshot = { accounts:[], sessions:[], asks:[], messages:[], launches:[] }
let launchOpts = null // /api/launch/options: whether the page can start sessions, and the drop-down choices
const sessionOf = acc => acc.session ? snapshot.sessions.find(s => s.id === acc.session) : null

// what a session waits for: an approval or an answer
function waitingText(sessionId) {
  const kinds = new Set(snapshot.asks.filter(a => a.session === sessionId).map(a => a.kind))
  const approval = kinds.has('permission'), answer = kinds.has('question')
  return t(approval && answer ? 'state.waitingBoth' : approval ? 'state.waitingApproval' : answer ? 'state.waitingAnswer' : 'state.waiting')
}
function statusText(s) {
  if (!s || s.state === 'ended') return t('state.ended')
  if (s.state === 'waiting') return waitingText(s.id)
  if (s.state === 'tool' && s.tool) return t('state.working', { tool:s.tool })
  return t('state.' + s.state)
}
// where a session's terminal is: a tmux command as it is, or a sentence for the window kinds
const attachText = a => a === 'window' ? t('attach.window') : a === 'console' ? t('attach.console') : (a || '')

// ================= characters: size follows the model, muscles follow the effort =================
// Modeled on the little fellow in the terminal banner (▐▛███▜▌ / ▝▜█████▛▘ / ▘▘ ▝▝): a square body,
// two upright eyes, small hands on the sides, four feet.
const MODEL_TIERS = [['haiku', 0], ['sonnet', 1], ['opus', 2], ['fable', 3]]
const EFFORT_TIERS = { low:0, medium:1, high:2, xhigh:3, max:4 }
function modelTier(model) {
  const m = String(model || '').toLowerCase()
  const hit = MODEL_TIERS.find(([k]) => m.includes(k))
  return hit ? hit[1] : 1
}
function effortTier(effort) {
  if (effort in EFFORT_TIERS) return EFFORT_TIERS[effort]
  const n = Number(effort)
  return effort && Number.isFinite(n) ? Math.max(0, Math.min(4, Math.round(n / 25))) : 1
}
function build(session) {
  const size = modelTier(session?.model), muscle = effortTier(session?.effort)
  return {
    size, muscle,
    bw:[10, 12, 14, 16][size], bh:[7, 8, 9, 10][size],
    armW:[1, 2, 2, 3, 3][muscle], armH:[2, 2, 3, 3, 4][muscle],
    headband:muscle >= 4, // at max effort it wears a red headband
  }
}
const MODEL_NAME = ['Haiku', 'Sonnet', 'Opus', 'Fable']
const EFFORT_NAME = ['low', 'medium', 'high', 'xhigh', 'max']
function buildText(s) {
  if (!s?.model) return ''
  const b = build(s)
  return t('card.build', { model:s.model + (s.effort ? ' · ' + s.effort : ''), size:MODEL_NAME[b.size], muscle:EFFORT_NAME[b.muscle] })
}

// cx: the body's center line; by: the body's bottom edge (the top of the feet)
// pose: eyes 'open'|'down'|'closed'|'none'; armL/armR move the arms up or down; raiseL/raiseR raise a hand;
// legs draws the feet; step is the foot stepping forward
function drawClawd(g, cx, by, b, pose, body = CLAWD, shade = CLAWD_SHADE) {
  const left = cx - (b.bw >> 1), top = by - b.bh
  rect(g, left, top, b.bw, b.bh, body)
  rect(g, left + b.bw - 1, top + 1, 1, b.bh - 1, shade)
  rect(g, left, by - 1, b.bw, 1, shade)
  const ex1 = left + 2, ex2 = left + b.bw - 3
  if (pose.eyes === 'open') { rect(g, ex1, top + 2, 1, 2, EYE); rect(g, ex2, top + 2, 1, 2, EYE) }
  else if (pose.eyes === 'down') { rect(g, ex1, top + 3, 1, 2, EYE); rect(g, ex2, top + 3, 1, 2, EYE) }
  else if (pose.eyes === 'closed') { rect(g, ex1 - 1, top + 3, 2, 1, EYE); rect(g, ex2, top + 3, 2, 1, EYE) }
  if (b.headband) {
    rect(g, left, top + 1, b.bw, 1, RED)
    rect(g, left + b.bw, top + 1, 2, 1, RED); rect(g, left + b.bw + 1, top + 2, 2, 1, RED)
  }
  const armY = top + Math.floor(b.bh / 2) - 1
  if (pose.raiseL) rect(g, left - b.armW, top - 4, b.armW, b.armH + 4, body)
  else rect(g, left - b.armW, armY + (pose.armL || 0), b.armW, b.armH, body)
  if (pose.raiseR) rect(g, left + b.bw, top - 4, b.armW, b.armH + 4, body)
  else rect(g, left + b.bw, armY + (pose.armR || 0), b.armW, b.armH, body)
  if (b.muscle >= 3) { // biceps
    if (!pose.raiseL) rect(g, left - b.armW - 1, armY + (pose.armL || 0), 1, b.armH - 1, body)
    if (!pose.raiseR) rect(g, left + b.bw + b.armW, armY + (pose.armR || 0), 1, b.armH - 1, body)
  }
  if (pose.legs) {
    const xs = [left + 1, left + 3, left + b.bw - 4, left + b.bw - 2]
    xs.forEach((x, i) => rect(g, x, by - (pose.step === (i < 2 ? 0 : 1) ? 1 : 0), 1, 2, body))
  }
}

const MINI_ROWS = ['..XXXXXX..', '..XEXXEX..', 'AXXXXXXXXB', '..SSSSSS..', '..L.LR.R..']
function drawMini(g, x, y, body, shade) {
  MINI_ROWS.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.') return
    rect(g, x + c, y + r, 1, 1, ch === 'E' ? EYE : ch === 'S' ? shade : body)
  }))
}

// ---------- idle pastimes ----------
function drawPhone(g, cx, by, t) {
  rect(g, cx + 1, by - 7, 4, 6, '#2b2a28')
  rect(g, cx + 2, by - 6, 2, 3, Math.floor(t / 700) % 2 ? '#9fd3f0' : '#c4e6f8')
}
function drawConsole(g, cx, by, t) {
  rect(g, cx - 5, by - 6, 10, 5, '#5a5e66')
  rect(g, cx - 2, by - 5, 4, 3, Math.floor(t / 250) % 2 ? '#7ccf6b' : '#5fb04f')
  rect(g, cx - 4, by - 4, 1, 1, RED); rect(g, cx + 3, by - 5, 1, 1, '#4a90d9'); rect(g, cx + 3, by - 3, 1, 1, YELLOW)
}
function drawZ(g, x, y, c) { rect(g, x, y, 3, 1, c); rect(g, x + 1, y + 1, 1, 1, c); rect(g, x, y + 2, 3, 1, c) }
function drawThinking(g, cx, top, t) {
  const n = Math.floor(t / 350) % 4
  for (let i = 0; i < n; i++) rect(g, cx - 4 + i * 3, top - 5, 2, 2, '#fffdf7')
}
function drawAlert(g, x, y) {
  rect(g, x, y, 7, 9, '#2b2a28'); rect(g, x + 1, y + 1, 5, 7, '#fffdf7')
  rect(g, x + 3, y + 2, 1, 3, RED); rect(g, x + 3, y + 6, 1, 1, RED)
  rect(g, x + 1, y + 9, 2, 1, '#2b2a28')
}
function drawEnvelope(g, x, y) {
  rect(g, x, y, 9, 6, '#2b2a28'); rect(g, x + 1, y + 1, 7, 4, '#fffdf7')
  rect(g, x + 2, y + 2, 1, 1, '#b9b3a8'); rect(g, x + 3, y + 3, 3, 1, '#b9b3a8'); rect(g, x + 6, y + 2, 1, 1, '#b9b3a8')
  rect(g, x + 4, y + 2, 1, 1, RED)
}
// Zs floating up from the right of the head, clear of the name tag
function drawZzz(g, x, top, b, t) {
  for (let i = 0; i < 3; i++) {
    const p = ((t / 900) + i / 3) % 1
    drawZ(g, x + (b.bw >> 1) + 3 + Math.round(p * 6), top + 2 - Math.round(p * 10), `rgba(255,253,247,${(1 - p).toFixed(2)})`)
  }
}
// the right hand of a character standing at cx, by: where it holds a mug, a can or a cup
const handOf = (cx, by, b, armR = 0) => ({ x:cx - (b.bw >> 1) + b.bw + b.armW, y:by - b.bh + Math.floor(b.bh / 2) - 1 + armR })
function drawMug(g, h, t) {

// ================= layout: a proper big company (open office + meeting room + lounge + reception) =================
// Desks are fixed by seat number: rows of 6, at least 3 rows; a small team still gets full rows of desks,
// a big one gets more rows below.
const MIN_ROWS = 3
const WORK_X = 16                                // left edge of the open office
const RIGHT_X = WORK_X + COLS * COL_PITCH + 24  // left edge of the meeting room and lounge side
const RIGHT_W = 13 * T
let W = 0, H = 0, rows = MIN_ROWS
const door = { x:0, y:0 }
const rooms = {} // each room's area, for furniture and signs
let addSeat = -1 // the empty seat with the "+", -1 for none
const bgCanvas = document.createElement('canvas')
const buf = document.createElement('canvas')

function deskOf(seat) {
  return { x:WORK_X + (seat % COLS) * COL_PITCH + 8, y:WALL_H + AISLE + LABEL_ROOM + Math.floor(seat / COLS) * ROW_PITCH }
}

function layout() {
  const taken = new Set(snapshot.accounts.map(a => a.seat))
  addSeat = -1
  if (launchOpts?.enabled) { addSeat = 0; while (taken.has(addSeat)) addSeat++ }
  const seats = Math.max(addSeat + 1, ...snapshot.accounts.map(a => a.seat + 1), 1)
  rows = Math.max(MIN_ROWS, Math.ceil(seats / COLS))
  const workBottom = deskOf((rows - 1) * COLS).y + 24
  W = RIGHT_X + RIGHT_W + 8
  H = Math.max(22 * T, workBottom + 5 * T)
  door.x = WORK_X + (COLS * COL_PITCH) / 2; door.y = H - 12
  const meetH = 9 * T
  rooms.work = { x:WORK_X - 6, y:WALL_H + AISLE + 6, w:COLS * COL_PITCH + 12, h:workBottom - (WALL_H + AISLE + 6) }
  rooms.meeting = { x:RIGHT_X, y:WALL_H, w:RIGHT_W, h:meetH }
  rooms.lounge = { x:RIGHT_X, y:WALL_H + meetH + 10, w:RIGHT_W, h:H - 6 - (WALL_H + meetH + 10) }
  rooms.front = { x:4, y:workBottom + 6, w:RIGHT_X - 8, h:H - 6 - (workBottom + 6) }
  buildPlaces()
  if (rows !== navRows) { // the graph changed under everyone's feet: put them straight where they're going
    navRows = rows
    for (const e of emps.values()) if (e.inside) e.fresh = true
  }
  for (const e of emps.values()) {
    const d = deskOf(e.acc.seat)
    e.desk = d
    e.seat = { x:d.x + 16, y:d.y - 2 }
  }
  drawBackground()
  resize()
}

// ================= walkways and spots =================
// Employees walk on a small graph: an aisle beside each column of desks, a corridor along the back wall and one
// along the reception, the corridor between the office and the rooms on the right, and walkways in each room.
// A spot is a node where an idle employee spends a while: a chair, a sofa seat, a place to stand.
const MEET_DOOR = 95 // the meeting room's doorway is in its glass wall on the corridor, this far down from its top
let nav = { pts:[], adj:[], door:-1, seats:[] }, navRows = 0
const navCache = new Map() // target node -> the way there from every node
const spots = new Map()    // id -> { id, x, y, node, room, face (1 front, -1 back), sit, nap }
let geo = {}               // furniture that comes alive (TV, foosball, printer) or hides people (sofa backrests)

function buildPlaces() {
  const pts = [], adj = []
  const node = (x, y) => (pts.push({ x, y }), adj.push([]), pts.length - 1)
  const link = (a, b) => { adj[a].push(b); adj[b].push(a) }
  const chain = ids => ids.reduce((a, b) => (link(a, b), b))
  const mark = (id, n, o) => spots.set(id, { id, x:pts[n].x, y:pts[n].y, node:n, face:1, sit:false, nap:false, ...o })
  const spot = (id, x, y, from, o) => { const n = node(x, y); link(n, from); mark(id, n, o) }
  spots.clear(); navCache.clear()
  const { work, meeting, lounge, front } = rooms
  const TOP = WALL_H + 14, BOT = work.y + work.h + 3, CX = (work.x + work.w + RIGHT_X) >> 1
  const top = new Map(), bot = new Map(), side = new Map() // corridor nodes, by x (by y for the side corridor)
  const at = (m, k, x, y) => m.get(k) ?? m.set(k, node(x, y)).get(k)
  const onTop = x => at(top, x, x, TOP), onBot = x => at(bot, x, x, BOT), onSide = y => at(side, y, CX, y)
  top.set(CX, onSide(TOP)); bot.set(CX, onSide(BOT))

  // the open office: each column's aisle runs from the back corridor to the front one, past its desks;
  // two windows on the back wall to look out of
  const seats = []
  for (let c = 0; c < COLS; c++) {
    const ax = deskOf(c).x + 40, aisle = [onTop(ax)]
    for (let r = 0; r < rows; r++) {
      const s = r * COLS + c, d = deskOf(s)
      aisle.push(node(ax, d.y - 2))
      seats[s] = node(d.x + 16, d.y - 2); link(seats[s], aisle.at(-1))
    }
    chain([...aisle, onBot(ax)])
  }
  spot('win0', WORK_X + 29, TOP - 4, onTop(WORK_X + 29), { room:'work', face:-1 })
  spot('win1', WORK_X + COLS * COL_PITCH - 29, TOP - 4, onTop(WORK_X + COLS * COL_PITCH - 29), { room:'work', face:-1 })

  // meeting room: a walkway around the table, ten chairs to nap on, the door on the corridor
  const tx = meeting.x + 48, ty = meeting.y + 52, tw = 112, th = 30, chairX = i => tx + 15 + i * 26

  bottoms.forEach((n, i) => spot('mb' + i, chairX(i), ty + th + 9, n, { room:'meeting', sit:true, nap:true, face:-1 }))
  spot('ml', tx - 8, ty + 19, byLeft, { room:'meeting', sit:true, nap:true })
  spot('mr', tx + tw + 9, ty + 19, byRight, { room:'meeting', sit:true, nap:true })

  // lounge: a street across the middle, a loop around the foosball table (for tag), an aisle in front of the sofa
  const lx = lounge.x, ly = lounge.y, lr = lx + lounge.w, lb = ly + lounge.h
  const street = ly + 64, aisle = lb - 32, north = ly + 10
  const fx = lx + 60, fy = ly + 22

  const fbN = node(fx + 17, north), fbS = node(fx + 29, street)

  const west = node(lx + 38, street), east = node(lx + 130, street), vend = node(lx + 143, street), cafe = node(lr - 31, street)
  chain([onSide(street), west, SW, fbS, SE, east, vend, cafe])
  const sofa = { x:lx + 46, y:lb - 27, w:68, c:'#4f7d8a', dark:'#3d6370' }, seatX = [11, 33, 56].map(dx => sofa.x + dx)

  const fb = front.y + front.h, fr = front.x + front.w, raisle = fb - 30

  const shelfA = node(front.x + 44, front.y + 46); link(shelfA, onBot(front.x + 44))

  spot('front', front.x + 92, front.y + 21, onBot(front.x + 92), { room:'front', sit:true })

  link(rA, onBot(rsofa.x + 20)); chain([r0, rA, r1])
  spot('rs0', rsofa.x + 9, fb - 12, r0, { room:'front', sit:true, nap:true, face:-1 })
  spot('rs1', rsofa.x + 31, fb - 12, r1, { room:'front', sit:true, nap:true, face:-1 })
  spot('print', fr - 61, raisle, r1, { room:'front', face:-1 })

  const sorted = m => [...m].sort((a, b) => a[0] - b[0]).map(([, n]) => n)
  chain(sorted(top)); chain(sorted(bot)); chain(sorted(side))
  nav = { pts, adj, door:doorN, seats }
  geo = { foos:{ x:fx, y:fy }, tv:{ x:lx + 62, y:lb - 72 }, sofa, rsofa, printer:{ x:fr - 74, y:front.y + 8 }, loop:[NW, NE, SE, SW] }
}

// the shortest way to a node from every node: dist[n] is how far, next[n] the node to go to next
function towards(target) {
  if (navCache.has(target)) return navCache.get(target)
  const { pts, adj } = nav, n = pts.length
  const dist = new Array(n).fill(Infinity), next = new Array(n).fill(-1), done = new Array(n).fill(false)
  dist[target] = 0
  for (;;) {
    let u = -1
    for (let i = 0; i < n; i++) if (!done[i] && dist[i] < Infinity && (u < 0 || dist[i] < dist[u])) u = i
    if (u < 0) break
    done[u] = true
    for (const v of adj[u]) {
      const d = dist[u] + Math.hypot(pts[u].x - pts[v].x, pts[u].y - pts[v].y)
      if (d < dist[v]) { dist[v] = d; next[v] = u }
    }
  }
  const way = { dist, next }
  navCache.set(target, way)
  return way
}

// ================= employees (one per account) =================
const emps = new Map() // account id -> employee
const WALK = 48, HURRY = 90, TAG_RUN = 70, TAG_CHASE = 84 // pixels per second

function makeEmployee(acc) {
  const label = document.createElement('div')
  label.className = 'emp-label'
  label.dataset.account = acc.id
  label.addEventListener('click', () => onEmployeeClick(acc.id))
  document.getElementById('labels').appendChild(label)
  return { acc, s:null, label, x:0, y:0, path:[], node:-1, goal:null, want:null, inside:false, fresh:false, facing:1,
    blinkAt:performance.now() + 2000 + Math.random() * 4000, phase:hash(acc.id) % 1000 }
}

const isOnline = e => !!e.s && e.s.state !== 'ended'

function updateEmployee(e, acc, walkIn) {
  const was = isOnline(e)
  e.acc = acc
  e.s = sessionOf(acc)
  const online = isOnline(e)
  if (online && !was && !e.inside) { // on duty: in through the door, or straight to its spot when the page opens
    if (walkIn) { e.x = door.x; e.y = door.y; e.node = nav.door; e.path = []; e.goal = null }
    else e.fresh = true
    e.inside = true
  } // off duty: the planner walks it out
  const state = online ? e.s.state : 'ended'
  e.label.style.borderLeftColor = STATE_COLOR[state] ?? GRAY
  e.label.classList.toggle('off', !online)
  e.label.dataset.state = state
  const status = statusText(online ? e.s : null)
  e.label.innerHTML = `<div class="nm">${esc(acc.name)}</div><div class="st">${dot(state)}${esc(status)}</div>`
  e.status = `${acc.name} · ${status}`
  e.sized = false
}

function dropEmployee(e) { e.label.remove(); e.bubble?.remove(); emps.delete(e.acc.id) }

// ================= idle life =================
// An idle employee stays at its desk a while (the next prompt may be on its way), then wanders off: TV on the
// lounge sofa, coffee, the vending machine, the water cooler, a window, the bookshelf, the printer, minding
// reception, or with a colleague foosball, tag or a chat at the round table. After a while it naps (most hide in
// the meeting room) and now and then wakes up for another round. It all counts from when the bridge saw the
// session go idle, so reloading the page wakes nobody. Work or a pending ask sends it back to its desk; so does a
// click, and then it stays there until its next turn.
const SETTLE = 20000, FIRST_NAP = 150000, NAP = 240000, WAKE = 90000, SLOT = 30000, PAIR_SLOT = 40000
const SOLO = [['tv', 4], ['coffee', 2], ['vending', 2], ['water', 2], ['window', 2], ['books', 2], ['print', 1], ['front', 2], ['desk', 1]]
const SOLO_SPOTS = { tv:['ls0', 'ls1', 'ls2'], coffee:['coffee'], vending:['vend'], water:['water'], window:['win0', 'win1'],
  books:['books'], print:['print'], front:['front'] }
const PAIR_SPOTS = { foosball:['fb0', 'fb1'], chase:['tag0', 'tag1'], chat:['rt0', 'rt1'] }
const NAP_SPOTS = [['mt0', 'mt1', 'mt2', 'mt3', 'mb0', 'mb1', 'mb2', 'mb3', 'ml', 'mr'], ['ls0', 'ls1', 'ls2'], ['rs0', 'rs1']]

// a well-mixed hash for the choices (similar strings get similar numbers from hash())
function rnd(s) {
  let h = 2166136261
  for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) }
  h ^= h >>> 16; h = Math.imul(h, 2246822507); h ^= h >>> 13; h = Math.imul(h, 3266489909); h ^= h >>> 16
  return h >>> 0
}
const idleSince = e => Date.parse(e.s?.stateSince || '') || Date.now()
const summoned = e => !!e.summon && e.s?.id === e.summon.session && e.s.stateSince === e.summon.since && e.s.state === 'idle'

// where an idle employee is in its rhythm at `at` (ms since 1970): settling at its desk, wandering, or napping;
// for a nap, also when it began
function rhythm(e, at) {
  const t = at - idleSince(e)
  if (t < SETTLE) return { phase:'settle' }
  if (t < FIRST_NAP) return { phase:'roam' }
  const k = (t - FIRST_NAP + rnd(e.acc.id + '/nap') % (NAP / 2)) % (NAP + WAKE) // each has its own
  return k < NAP ? { phase:'nap', since:at - k } : { phase:'roam' }
}

// at its desk: ready for work right after a click, then the phone or games (each has a preference, switching
// every half minute), asleep in the end
function deskPastime(e, at) {
  const called = summoned(e), t = at - (called ? e.summon.at : idleSince(e))
  if (e.want?.act === 'nap' || (called && t > FIRST_NAP)) return 'sleep'
  if (called && t < 60000) return 'ready'
  return ['phone', 'game'][(hash(e.acc.id) + Math.floor(t / 30000)) % 2]
}

// Pairs form on a clock all pages share: in each PAIR_SLOT, the employees who were already wandering when it
// began may pair up (not every time) for foosball, tag or a chat. Foosball and tag need the same table.
let pairMemo = { slot:-1, pairs:[] }
function pairsAt(at, roamers) {
  const P = Math.floor(at / PAIR_SLOT)
  if (pairMemo.slot !== P) {
    const start = P * PAIR_SLOT
    const pool = roamers.filter(e => rhythm(e, start).phase === 'roam')
      .sort((a, b) => rnd(a.acc.id + '/' + P) - rnd(b.acc.id + '/' + P))
    const pairs = [], used = new Set(), kinds = ['foosball', 'chase', 'chat'], table = k => k === 'chase' ? 'foosball' : k
    for (let i = 0; i + 1 < pool.length && pairs.length < 2; i += 2) {
      if (rnd('pair/' + P + '/' + i) % 10 >= 7) continue
      const first = rnd('kind/' + P + '/' + i) % 3
      const kind = [0, 1, 2].map(k => kinds[(first + k) % 3]).find(k => !used.has(table(k)))
      if (!kind) break
      used.add(table(kind))
      pairs.push({ kind, key:P + '/' + i, ids:[pool[i].acc.id, pool[i + 1].acc.id] })
    }
    pairMemo = { slot:P, pairs }
  }
  return pairMemo.pairs
}

// a solo idea for each half minute, best first: a weighted pick that differs from the last one, then the rest
function soloIdeas(e, slot) {
  const total = SOLO.reduce((n, [, w]) => n + w, 0)
  const pick = k => { let r = rnd(e.acc.id + '/' + k) % total; return SOLO.find(([, w]) => (r -= w) < 0)[0] }
  let first = pick(slot)
  if (slot > 0 && first === pick(slot - 1)) first = pick(slot + 1e6)
  const rest = SOLO.map(([a]) => a).filter(a => a !== first), h = rnd(e.acc.id + '/order/' + slot)
  return [first, ...rest.map((_, i) => rest[(i + h) % rest.length])]
}

// where everyone in the building should be now, and what for: Map employee -> { act, spot, hurry, pair }
function planLife(at) {
  const plan = new Map(), taken = new Set()
  const desk = e => ({ id:'desk', x:e.seat.x, y:e.seat.y, node:nav.seats[e.acc.seat], room:'desk', face:1, sit:true })
  const free = (ids, turn) => ids.map((_, i) => spots.get(ids[(i + turn) % ids.length])).find(s => s && !taken.has(s.id))
  const claim = (e, act, s, more) => { taken.add(s.id); plan.set(e, { act, spot:s, ...more }) }
  const naps = [], roam = []
  for (const e of emps.values()) {
    if (!e.inside || !e.desk) continue
    if (!isOnline(e)) plan.set(e, { act:'out', spot:{ id:'out', x:door.x, y:door.y, node:nav.door, room:'out', face:1 } })
    else if (e.s.state !== 'idle') plan.set(e, { act:'work', spot:desk(e), hurry:true })
    else if (summoned(e)) plan.set(e, { act:'ready', spot:desk(e), hurry:true })
    else {
      const r = rhythm(e, at)
      if (r.phase === 'settle') plan.set(e, { act:'desk', spot:desk(e) })
      else if (r.phase === 'nap') naps.push([e, r.since])
      else roam.push(e)
    }
  }
  // nappers keep their spot for the whole nap (whoever fell asleep first chose first): most like the meeting
  // room, some a sofa, some their own desk
  naps.sort((a, b) => a[1] - b[1] || (a[0].acc.id < b[0].acc.id ? -1 : 1))
  for (const [e] of naps) {
    const h = rnd(e.acc.id + '/bed'), k = h % 20
    const order = k < 11 ? [0, 1, 2] : k < 14 ? [1, 0, 2] : k < 17 ? [2, 0, 1] : []
    const s = order.map(i => free(NAP_SPOTS[i], h)).find(Boolean)
    if (s) claim(e, 'nap', s); else plan.set(e, { act:'nap', spot:desk(e) })
  }
  // pairs
  const paired = new Set()
  for (const pair of pairsAt(at, roam)) {
    const two = pair.ids.map(id => emps.get(id)), ids = PAIR_SPOTS[pair.kind]
    if (!two.every(e => e && roam.includes(e)) || ids.some(id => taken.has(id))) continue
    two.forEach((e, i) => { claim(e, pair.kind, spots.get(ids[i]), { pair }); paired.add(e) })
  }
  // the rest wander on their own; whoever had its idea first gets the spot
  const solo = roam.filter(e => !paired.has(e)).map(e => {
    const t = at - idleSince(e) - SETTLE + rnd(e.acc.id + '/beat') % (SLOT / 2) // each its own beat, the first idea lasting 15 to 30 s
    return { e, slot:Math.floor(t / SLOT), since:at - t % SLOT }
  })
  solo.sort((a, b) => a.since - b.since || (a.e.acc.id < b.e.acc.id ? -1 : 1))
  for (const { e, slot } of solo) {
    const act = soloIdeas(e, slot).find(a => a === 'desk' || free(SOLO_SPOTS[a], 0))
    if (act === 'desk') plan.set(e, { act, spot:desk(e) })
    else claim(e, act, free(SOLO_SPOTS[act], rnd(e.acc.id + '/' + act)))
  }
  return plan
}

// every frame: follow the plan, walk, play
function lifeTick(at, now, dt) {
  const plan = planLife(at)
  for (const [e, w] of plan) {
    e.want = w
    if (e.fresh) { place(e, w.spot, now); e.fresh = false }
    else if (e.goal?.id !== w.spot.id) go(e, w.spot)
    else e.goal = w.spot // the same spot, maybe rebuilt by a new layout
  }
  playTag(plan, now, dt)
  for (const e of plan.keys()) e.moving = move(e, dt, now)
}

function place(e, spot, now) {
  e.x = spot.x; e.y = spot.y; e.node = spot.node; e.path = []; e.goal = spot; e.arrived = now; e.tag = null
  if (spot.id === 'out') e.inside = false
}

// sets off for a spot along the walkways, from the node it last passed or the one it was heading for,
// whichever makes the shorter trip
function go(e, spot) {
  e.goal = spot; e.tag = null
  const { pts } = nav, { dist, next } = towards(spot.node)
  let from = -1, best = Infinity
  for (const n of [e.node, e.path[0]?.n]) {
    if (!(n >= 0)) continue
    const d = Math.hypot(pts[n].x - e.x, pts[n].y - e.y) + dist[n]
    if (d < best) { from = n; best = d }
  }
  if (from < 0 || best === Infinity) return place(e, spot, performance.now())
  e.path = []
  for (let n = from; n >= 0; n = next[n]) e.path.push({ x:pts[n].x, y:pts[n].y, n })
}

// one frame of walking; true while on the way
function move(e, dt, now) {
  if (e.tag) return true // the game of tag moves it
  if (!e.path.length) return false
  let left = (e.want?.hurry ? HURRY : WALK) * dt
  while (left > 0 && e.path.length) {
    const p = e.path[0], dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy)
    e.facing = dy < -0.01 ? -1 : 1 // walking up, we see the back
    if (d <= left) { e.x = p.x; e.y = p.y; e.node = p.n; e.path.shift(); left -= d }
    else { e.x += dx / d * left; e.y += dy / d * left; left = 0 }
  }
  if (!e.path.length) { e.arrived = now; if (e.goal?.id === 'out') e.inside = false }
  return true
}

// Tag around the foosball table: "it" runs a little faster than the other; a tag turns them both around,
// and the new "it" counts a second before giving chase.
const tagGames = new Map() // pair key -> { s:[distance along the loop of each], it, dir, wait, pow }
function playTag(plan, now, dt) {
  const loop = geo.loop.map(n => nav.pts[n]), lens = loop.map((p, i) => Math.hypot(loop[(i + 1) % 4].x - p.x, loop[(i + 1) % 4].y - p.y))
  const L = lens.reduce((a, b) => a + b)
  const where = s => {
    s = ((s % L) + L) % L
    let i = 0
    while (i < 3 && s > lens[i]) s -= lens[i++]
    const p = loop[i], q = loop[(i + 1) % 4], f = Math.min(1, s / lens[i])
    return { x:p.x + (q.x - p.x) * f, y:p.y + (q.y - p.y) * f, edge:i }
  }
  const live = new Set()
  for (const pair of pairMemo.pairs) {
    if (pair.kind !== 'chase') continue
    const two = pair.ids.map(id => emps.get(id))
    if (!two.every(e => e && plan.get(e)?.pair === pair)) continue
    if (!two.every(e => e.tag || (!e.path.length && e.goal?.id.startsWith('tag')))) continue // waiting for the other
    live.add(pair.key)
    let game = tagGames.get(pair.key)
    if (!game) tagGames.set(pair.key, game = { s:[0, L / 2], it:0, dir:1, wait:0, pow:null })
    const run = 1 - game.it
    game.s[run] += game.dir * TAG_RUN * dt
    if (game.wait > 0) game.wait -= dt
    else game.s[game.it] += game.dir * TAG_CHASE * dt
    if (game.wait <= 0 && (((game.s[run] - game.s[game.it]) * game.dir) % L + L) % L < 6) {
      const p = where(game.s[run])
      game.pow = { x:p.x, y:p.y - 6, at:now }
      game.it = run; game.dir = -game.dir; game.wait = 1
    }
    two.forEach((e, i) => {
      const p = where(game.s[i])
      e.x = p.x; e.y = p.y; e.node = geo.loop[p.edge]; e.path = []
      e.facing = (game.dir > 0 ? p.edge === 3 : p.edge === 1) ? -1 : 1
      e.tag = { it:game.it === i, wait:game.it === i && game.wait > 0 }
    })
  }
  for (const key of tagGames.keys()) if (!live.has(key)) tagGames.delete(key)
}

// a chat at the round table: they take turns, a bubble each
function chatLine(e, pair, now) {
  const k = Math.floor(now / 1800)
  if (!pair || now % 1800 > 1400 || !pair.ids.every(id => emps.get(id)?.there)) return null
  if (pair.ids[rnd(pair.key + '/' + k) % 2] !== e.acc.id) return null
  return ['…', '!', '?', '♥', '♪'][rnd(pair.key + '/say/' + k) % 5]
}

// what an idle employee is doing, in words (for the card, the search list and the name tag's tooltip)
function doingText(e) {
  if (!e.inside || !isOnline(e) || e.s.state !== 'idle' || !e.want) return ''
  const w = e.want, room = e.goal?.room
  if (e.moving && !e.tag) return t(w.act === 'ready' ? 'idle.back' : 'idle.walk')
  const doing = t('idle.' + w.act)
  if (room && room !== 'desk') return t('idle.where', { doing, room:t('room.' + room) })
  return w.act === 'nap' ? t('idle.where', { doing, room:t('idle.desk') }) : doing
}
const stateLine = e => { const doing = doingText(e); return statusText(isOnline(e) ? e.s : null) + (doing ? ' · ' + doing : '') }

// ================= rendering =================
const cv = document.getElementById('office'), ctx = cv.getContext('2d')
let S = 1, offX = 0, offY = 0, dpr = 1

function resize() {
  dpr = devicePixelRatio || 1
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr)
  const fit = Math.min(cv.width / W, cv.height / H)
  S = fit >= 2 ? Math.floor(fit) : fit // scale by whole numbers when possible so pixels stay square; on small screens a fractional scale beats a tiny office
  offX = Math.round((cv.width - W * S) / 2); offY = Math.round((cv.height - H * S) / 2)
}
const toCss = (x, y) => [(offX + x * S) / dpr, (offY + y * S) / dpr]

const flights = [] // envelopes in flight { from, to, t, toAcc }
const mailAt = new Map() // account id -> when mail arrived; it shows above the head for a while

function frame(now) {
  requestAnimationFrame(frame) // first, so one bad frame doesn't stop the office
  const dt = Math.min((now - (frame.last || now)) / 1000, 0.1)
  frame.last = now
  const at = Date.now()
  const g = buf.getContext('2d')
  g.drawImage(bgCanvas, 0, 0)
  lifeTick(at, now, dt)

  const items = [] // sorted by the feet's y, so nearer things cover farther ones
  const taken = new Set(snapshot.accounts.map(a => a.seat))
  for (let seat = 0; seat < rows * COLS; seat++) { // empty desks are drawn too
    if (taken.has(seat)) continue
    const d = deskOf(seat)
    items.push({ y:d.y - 3, draw:() => drawChair(g, d.x, d.y) })
    items.push({ y:d.y + 14, draw:() => { drawDesk(g, d.x, d.y, OFF); drawClutter(g, d.x, d.y, seat) } })
  }
  const using = new Set() // spots someone has reached
  let watching = false
  for (const e of emps.values()) {
    if (!e.desk) continue
    const online = isOnline(e), st = online ? e.s.state : 'ended'
    items.push({ y:e.desk.y - 3, draw:() => drawChair(g, e.desk.x, e.desk.y) })
    items.push({ y:e.desk.y + 14, draw:() => { drawDesk(g, e.desk.x, e.desk.y, online ? STATE_COLOR[st] : OFF); drawClutter(g, e.desk.x, e.desk.y, e.acc.seat) } })
    if (e.inside) {
      items.push(employeeItem(g, e, now, at))
      if (e.there) { using.add(e.goal.id); watching ||= e.want?.act === 'tv' }
    } else e.there = e.atDesk = false
    // subagents: small ones standing in the aisles beside the desk
    if (online) Object.values(e.s.agents || {}).slice(-4).forEach((a, i) => {
      const ax = e.desk.x + (i % 2 ? 35 : -13), ay = e.desk.y + 2 + Math.floor(i / 2) * 8
      const busy = a.state === 'tool' || a.state === 'thinking'
      const bob = busy && Math.floor((now + i * 90) / 200) % 2 ? -1 : 0
      const color = a.state === 'done' ? GRAY : MINI, shade = a.state === 'done' ? '#8f8a82' : MINI_SHADE
      items.push({ y:ay + 5, draw:() => drawMini(g, ax, ay + bob, color, shade) })
    })
  }
  // furniture that comes alive while it's used, the sofa backrests over whoever sits there, and a tag's burst
  const { tv, foos, printer, sofa, rsofa } = geo
  if (watching) items.push({ y:tv.y + 19, draw:() => drawTVShow(g, tv.x, tv.y, now) })
  if (using.has('fb0') && using.has('fb1')) items.push({ y:foos.y + 13, draw:() => drawFoosBall(g, foos.x, foos.y, now) })
  if (using.has('print')) items.push({ y:printer.y + 21, draw:() => drawPaper(g, printer.x, printer.y, now) })
  for (const s of [sofa, rsofa]) items.push({ y:s.y + 24, draw:() => drawSofaBack(g, s) })
  for (const { pow } of tagGames.values()) {
    if (pow && now - pow.at < 500) items.push({ y:Infinity, draw:() => drawPow(g, Math.round(pow.x), Math.round(pow.y), (now - pow.at) / 500) })
  }
  items.sort((a, b) => a.y - b.y).forEach(it => it.draw())

  // envelopes in flight: an arc from the sender's head to the recipient's
  for (let i = flights.length - 1; i >= 0; i--) {
    const f = flights[i]
    f.t += dt / 1.6
    const p = Math.min(f.t, 1)
    const x = f.from.x + (f.to.x - f.from.x) * p, y = f.from.y + (f.to.y - f.from.y) * p - Math.sin(p * Math.PI) * 24
    drawEnvelope(g, Math.round(x) - 4, Math.round(y) - 3)
    if (f.t >= 1) { flights.splice(i, 1); mailAt.set(f.toAcc, now) }
  }

  ctx.imageSmoothingEnabled = false
  ctx.fillStyle = '#2f2e2b'
  ctx.fillRect(0, 0, cv.width, cv.height)
  ctx.drawImage(buf, 0, 0, W, H, offX, offY, W * S, H * S)
  placeLabels(now)
  if (!findList.hidden && now - (frame.listed || 0) > 500) { frame.listed = now; renderFind() } // what they're doing changes
  refreshCardLine()
}

// one employee in the building, as a depth-sorted item: its pose follows its state, where it is and what it does there
function employeeItem(g, e, now, at) {
  const online = isOnline(e), st = online ? e.s.state : 'ended', w = e.want || {}, spot = e.goal
  const t = now + e.phase, b = build(e.s)
  e.there = !e.moving && !e.tag && !!spot && !e.path.length
  e.atDesk = e.there && spot.id === 'desk'
  const act = e.there ? w.act : null, pastime = e.atDesk && st === 'idle' ? deskPastime(e, at) : null
  const blink = now > e.blinkAt && now < e.blinkAt + 140
  if (now > e.blinkAt + 140) e.blinkAt = now + 2500 + Math.random() * 4000
  const x = Math.round(e.x)
  let y = Math.round(e.y), face = e.there ? spot.face : e.facing, extra = null
  const pose = { eyes:blink ? 'closed' : 'open', legs:!(e.there && spot.sit), step:-1, armL:0, armR:0 }
  const sip = Math.floor(t / 3000) % 3 === 0 // now and then a sip
  if (e.tag) {
    pose.step = Math.floor(t / 80) % 2
    if (e.tag.wait) pose.eyes = 'closed' // counting
    else if (e.tag.it) pose.raiseL = pose.raiseR = true
  } else if (e.moving) {
    pose.step = Math.floor(t / (w.hurry ? 90 : 150)) % 2
  } else if (e.atDesk) {
    const typing = st === 'tool'
    if (pastime === 'sleep') { y += 1; pose.eyes = 'closed' } else if (pastime && pastime !== 'ready' && !blink) pose.eyes = 'down'
    pose.armL = typing ? Math.floor(t / 140) % 2 : pastime === 'game' ? Math.floor(t / 120) % 2 : 0
    pose.armR = typing ? 1 - Math.floor(t / 140) % 2 : pastime === 'phone' ? -2 : pastime === 'game' ? Math.floor(t / 170) % 2 : 0
    pose.raiseL = st === 'waiting'
    extra = top => {
      if (pastime === 'phone') drawPhone(g, x, y, t)
      else if (pastime === 'game') drawConsole(g, x, y, t)
      else if (pastime === 'sleep') drawZzz(g, x, top, b, t)
      if (st === 'thinking') drawThinking(g, x, top, t)
      if (st === 'waiting') drawAlert(g, x + (b.bw >> 1) + b.armW + 2, top - 3 - (Math.floor(t / 400) % 2))
    }
  } else if (e.there) {
    switch (act) {
      case 'nap':
        if (face > 0) { y += 1; pose.eyes = 'closed' } // head down on the table
        extra = top => drawZzz(g, x, top, b, t)
        break
      case 'tv':
        if (Math.floor(t / 600) % 12 === 0) pose.raiseL = pose.raiseR = true // what a goal
        break
      case 'coffee': case 'water':
        pose.armR = sip ? -2 : 0
        extra = () => act === 'coffee' ? drawMug(g, handOf(x, y, b, pose.armR), t) : drawCup(g, handOf(x, y, b, pose.armR))
        break
      case 'vending':
        if (now - e.arrived < 4000) { face = -1; pose.armR = Math.floor(t / 250) % 2 ? -1 : 0 } // choosing, pressing buttons
        else { pose.armR = sip ? -2 : 0; extra = () => drawCan(g, handOf(x, y, b, pose.armR)) }
        break
      case 'books':
        if (!blink) pose.eyes = 'down'
        extra = () => drawBook(g, x, y, b)
        break
      case 'front':
        if (!blink && Math.floor(t / 2500) % 2) pose.eyes = 'down'
        pose.raiseL = Math.floor(t / 500) % 14 === 0 // waves at the door
        break
      case 'foosball':
        pose.armL = Math.floor(t / 110) % 2; pose.armR = 1 - Math.floor(t / 130) % 2
        if (Math.floor(t / 700) % 9 === 0) pose.raiseL = pose.raiseR = true // scored
        break
      case 'chat':
        extra = top => {
          const say = chatLine(e, w.pair, now)
          if (say) drawSay(g, spot.id === 'rt0' ? x - (b.bw >> 1) - b.armW - 10 : x + (b.bw >> 1) + b.armW + 1, top + 1, say)
        }
        break
      // window, print, and tag (waiting at the corner for the other): just standing there
    }
  }
  if (face < 0) pose.eyes = 'none'
  const body = online ? CLAWD : GRAY, shade = online ? CLAWD_SHADE : '#8f8a82'
  const dim = findQ && !matchesFind(e, findQ), ring = (findQ && !dim) || now - (e.foundAt ?? -1e9) < 4000
  return { y:y + 10, draw:() => {
    if (dim) g.globalAlpha = 0.3
    if (ring) drawRing(g, x, y, b, now)
    drawClawd(g, x, y, b, pose, body, shade)
    const top = y - b.bh
    extra?.(top)
    if (now - (e.popAt ?? -1e9) < 1200) drawSay(g, x + (b.bw >> 1) + b.armW + 1, top - 1, '!') // called back
    const got = mailAt.get(e.acc.id)
    if (got && now - got < 4000) drawEnvelope(g, x - 4, top - 10 - (Math.floor(now / 300) % 2))
    g.globalAlpha = 1
  } }
}

function headOf(e) {
  const b = build(e.s)
  return e.inside ? { x:Math.round(e.x), y:Math.round(e.y) - b.bh - 4 } : { x:e.desk.x + 16, y:e.desk.y - 12 }
}

const setData = (el, key, value) => { if (el.dataset[key] !== value) el.dataset[key] = value }

// Name tags follow their employees. Away from its desk a tag shows just the name, and a tag that stays put
// (on a sofa, at the meeting table) moves up out of the way of the tags already there.
function placeLabels(now) {
  const maxW = Math.max(60, COL_PITCH * S / dpr - 6), placed = [], loose = []
  const box = (e, y) => ({ l:e.lx - e.lw / 2, r:e.lx + e.lw / 2, t:y - e.lh, b:y })
  for (const e of emps.values()) {
    if (!e.desk) continue
    const el = e.label, away = e.inside && !e.atDesk
    if (el.classList.contains('away') !== away) { el.classList.toggle('away', away); e.sized = false }
    if (e.maxW !== maxW) { el.style.maxWidth = maxW + 'px'; e.maxW = maxW; e.sized = false }
    if (!e.sized) { e.lw = el.offsetWidth; e.lh = el.offsetHeight; e.sized = true }
    const h = headOf(e)
    ;[e.lx, e.ly] = toCss(h.x, h.y - 2)
    e.ty = e.ly
    if (!away) placed.push(box(e, e.ly))
    else if (!e.moving) loose.push(e)
    // for the tests and the curious: what it's up to, and where
    setData(el, 'act', e.inside ? e.want?.act ?? '' : '')
    setData(el, 'room', e.inside ? e.goal?.room ?? '' : '')
    setData(el, 'spot', e.inside ? e.goal?.id ?? '' : '')
    setData(el, 'moving', e.inside && e.moving ? '1' : '0')
    const hit = !!findQ && matchesFind(e, findQ)
    el.classList.toggle('dim', !!findQ && !hit)
    el.classList.toggle('match', hit)
    el.classList.toggle('found', now - (e.foundAt ?? -1e9) < 3200)
    const doing = doingText(e)
    const title = e.status + (doing ? ' · ' + doing : '') + (doing && away ? ' · ' + t('office.callBack') : '')
    if (el.title !== title) el.title = title
  }
  loose.sort((a, b) => b.ly - a.ly)
  for (const e of loose) {
    for (let k = 0; k < 12; k++) {
      const me = box(e, e.ty), hit = placed.find(p => p.l < me.r && me.l < p.r && p.t < me.b && me.t < p.b)
      if (!hit) break
      e.ty = hit.t - 1
    }
    placed.push(box(e, e.ty))
  }
  for (const e of emps.values()) {
    if (!e.desk) continue
    e.label.style.left = e.lx + 'px'; e.label.style.top = e.ty + 'px'
    if (e.bubble) { e.bubble.style.left = e.lx + 'px'; e.bubble.style.top = e.ty + 'px' }
  }
  for (const [key, el] of Object.entries(roomEls)) {
    const r = rooms[key]
    if (!r) continue
    // the open office's sign goes bottom left; top left would be hidden by the first row's name tags
    const [x, y] = key === 'sign' ? toCss(WORK_X + (COLS * COL_PITCH) / 2 + 6, 22)
      : key === 'work' ? toCss(r.x + 3, r.y + r.h - 12) : toCss(r.x + 3, r.y + 3)
    el.style.left = x + 'px'; el.style.top = y + 'px'
  }
  addBtn.hidden = addSeat < 0
  if (addSeat >= 0) {
    const d = deskOf(addSeat)
    const [ax, ay] = toCss(d.x + 16, d.y - 10)
    addBtn.style.left = ax + 'px'; addBtn.style.top = ay + 'px'
  }
}

// ================= search =================
// Finds employees by name (or session name, or folder): the matches light up in the office and show in a list
// under the box; picking one (a click, or Enter for the highlighted one) is the same as clicking that employee.
const findEl = document.getElementById('find'), findList = document.getElementById('find-list')
let findQ = '', findSel = 0
const lower = s => String(s ?? '').toLowerCase()
// a folder matches by its last part ("symphony"), or by its whole path once the query has a slash in it
const matchesFind = (e, q) => [e.acc.name, e.s?.title, ...[e.s?.cwd, e.acc.last?.dir].map(d => d && (/[\\/]/.test(q) ? d : base(d)))]
  .some(v => lower(v).includes(q))
function findHits() {
  if (!findQ) return []
  const rank = e => lower(e.acc.name).startsWith(findQ) ? 0 : lower(e.acc.name).includes(findQ) ? 1 : 2
  return [...emps.values()].filter(e => matchesFind(e, findQ))
    .sort((a, b) => rank(a) - rank(b) || a.acc.name.localeCompare(b.acc.name, lang)).slice(0, 8)
}
function renderFind() {
  findQ = lower(findEl.value.trim())
  const hits = findHits()
  findSel = Math.max(0, Math.min(findSel, hits.length - 1))
  findList.hidden = !findQ || document.activeElement !== findEl
  findList.innerHTML = hits.map((e, i) => `<div class="hit${i === findSel ? ' on' : ''}" data-account="${esc(e.acc.id)}">` +
    `${dot(isOnline(e) ? e.s.state : 'ended')}<b>${esc(e.acc.name)}</b><small>${esc(stateLine(e))}</small></div>`).join('') ||
    `<div class="none">${esc(t('search.none'))}</div>`
}
function pickFound(e) {
  findEl.value = ''; findSel = 0; findEl.blur(); renderFind()
  if (!e) return
  e.foundAt = performance.now()
  onEmployeeClick(e.acc.id)
}
findEl.addEventListener('input', () => { findSel = 0; renderFind() })
findEl.addEventListener('focus', renderFind)
findEl.addEventListener('blur', () => { findList.hidden = true })
findEl.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { findSel += ev.key === 'ArrowDown' ? 1 : -1; renderFind() }
  else if (ev.key === 'Enter') pickFound(findHits()[findSel])
  else if (ev.key === 'Escape') { findEl.value = ''; renderFind(); findEl.blur() }
  else return
  ev.preventDefault()
})
findList.addEventListener('mousedown', ev => { // mousedown, so the box keeps its focus until the pick
  const row = ev.target.closest('.hit')
  if (!row) return
  ev.preventDefault()
  pickFound(emps.get(row.dataset.account))
})
addEventListener('keydown', ev => { // "/" jumps to the search box
  if (ev.key !== '/' || ev.ctrlKey || ev.metaKey || ev.altKey || !asksModal.hidden || !dlg.hidden) return
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return
  ev.preventDefault()
  findEl.focus()
})

// ================= data =================
const logEl = document.getElementById('log')
function log(text) {
  const d = document.createElement('div')
  d.textContent = `${new Date().toLocaleTimeString(lang)}  ${text}`
  logEl.appendChild(d)
  while (logEl.children.length > 6) logEl.firstChild.remove()
}

const empBySession = id => [...emps.values()].find(e => e.s && e.s.id === id)

// messages between sessions: an envelope flies from sender to recipient, a bubble pops up over the sender,
// and the message log gets it
function showMessage(m) {
  const from = empBySession(m.from), to = empBySession(m.to)
  if (from && to) flights.push({ from:headOf(from), to:headOf(to), t:0, toAcc:to.acc.id })
  else if (to) mailAt.set(to.acc.id, performance.now())
  if (!from) return
  from.bubble?.remove()
  const el = document.createElement('div')
  el.className = 'bubble'
  el.innerHTML = `<b>→ ${esc(m.toName || '?')}</b>${esc(t('common.colon'))}${esc(m.text.length > 60 ? m.text.slice(0, 60) + '…' : m.text)}`
  document.getElementById('labels').appendChild(el)
  from.bubble = el
  setTimeout(() => { if (from.bubble === el) from.bubble = null; el.remove() }, 6000)
}

let first = true
const seenMessages = new Set()
const seenAsks = new Set()
function applySnapshot(snap) {
  snapshot = snap
  const live = new Set(snap.accounts.map(a => a.id))
  for (const [id, e] of emps) if (!live.has(id)) dropEmployee(e)
  for (const acc of snap.accounts) {
    if (!emps.has(acc.id)) emps.set(acc.id, makeEmployee(acc))
    emps.get(acc.id).acc = acc
  }
  layout()
  for (const acc of snap.accounts) updateEmployee(emps.get(acc.id), acc, !first)
  for (const m of snap.messages) {
    if (seenMessages.has(m.id)) continue
    seenMessages.add(m.id)
    if (!first) { showMessage(m); log(`${m.fromName || '?'} → ${m.toName || '?'}${t('common.colon')}${m.text}`) }
  }
  // new pending asks open the popup right away (not while the launch dialog is open; the HUD has a button)
  const fresh = snap.asks.filter(a => !seenAsks.has(a.id))
  fresh.forEach(a => seenAsks.add(a.id))
  if (fresh.length && dlg.hidden) openAsks()
  renderAsks()
  first = false

  const online = snap.accounts.map(sessionOf).filter(s => s && s.state !== 'ended')
  const count = (...states) => online.filter(s => states.includes(s.state)).length
  const stat = (state, key, n) => `${dot(state)}${esc(t(key, { n }))}`
  document.getElementById('stats').innerHTML = snap.accounts.length
    ? stat('idle', 'stats.idle', count('idle')) + stat('tool', 'stats.working', count('thinking', 'tool')) +
      stat('waiting', 'stats.waiting', count('waiting')) + stat('ended', 'stats.offDuty', snap.accounts.length - online.length)
    : esc(t('office.nobody'))
  if (cardFor) showCard(cardFor)
  if (!msgsPanel.hidden) renderMessages()
  if (!findList.hidden) renderFind()
  watchLaunch()
}

function applyEvent(ev, name) {
  const who = (name || ev.session.slice(0, 6)) + (ev.agentId ? ' / ' + t('common.subagent') : '')
  if (ev.kind === 'tool.start') log(`${who}  ${ev.tool}`)
  else if (ev.kind === 'session.start') log(`${who}  ${t('log.onDuty')}`)
  else if (ev.kind === 'session.end') log(`${who}  ${t('log.offDuty')}`)
}

// ================= pending popup =================
const asksModal = document.getElementById('asks-modal')
let asksFilter = null // show only this session's asks
function askWho(a) {
  const acc = snapshot.accounts.find(x => x.id === a.account)
  return `<div class="who"><span class="name">${esc(acc?.name ?? a.session.slice(0, 6))}</span>
    <span class="kind">${a.agentId ? esc(t('common.subagent')) + ' · ' : ''}${esc(t(a.kind === 'question' ? 'asks.question' : 'asks.permission'))}</span></div>`
}
function renderAsks() {
  let asks = snapshot.asks
  if (asksFilter && asks.some(a => a.session === asksFilter)) asks = asks.filter(a => a.session === asksFilter)
  syncCards(document.getElementById('asks'), asks, askWho)
  document.getElementById('asks-title').textContent = t('asks.title', { n:snapshot.asks.length })
  const btn = document.getElementById('open-asks')
  btn.hidden = !snapshot.asks.length
  btn.textContent = t('asks.button', { n:snapshot.asks.length })
  if (!snapshot.asks.length) asksModal.hidden = true
}
function openAsks(session = null) { asksFilter = session; renderAsks(); if (snapshot.asks.length) asksModal.hidden = false }
document.getElementById('asks-later').onclick = () => { asksModal.hidden = true }
document.getElementById('open-asks').onclick = () => openAsks()
asksModal.addEventListener('click', ev => { if (ev.target === asksModal) asksModal.hidden = true })

// ================= message log =================
const msgsPanel = document.getElementById('msgs-panel')
function msgHTML(m) {
  return `<div class="msg"><div class="meta">${fmtTime(m.time)} · <b>${esc(m.fromName || '?')}</b> → <b>${esc(m.toName || '?')}</b>
    ${m.delivered ? '' : `<span class="lost">${esc(t('msg.undelivered'))}</span>`}</div>${esc(m.text)}</div>`
}
function renderMessages() {
  msgsPanel.querySelector('.msgs').innerHTML = [...snapshot.messages].reverse().map(msgHTML).join('') || `<div class="msg">${esc(t('msg.none'))}</div>`
}
document.getElementById('open-msgs').onclick = () => { renderMessages(); msgsPanel.hidden = false }
msgsPanel.querySelector('.close').onclick = () => { msgsPanel.hidden = true }

// ================= employee card =================
const card = document.getElementById('card')
let cardFor = null
card.querySelector('.close').onclick = () => { card.hidden = true; cardFor = null }

// a click on an employee: the pending popup if it waits for you; otherwise its card, and an idle one goes back
// to its desk and waits there for its next turn
function onEmployeeClick(id) {
  const acc = snapshot.accounts.find(a => a.id === id)
  const s = acc && sessionOf(acc), e = emps.get(id)
  if (s && s.state === 'waiting') return openAsks(s.id)
  if (e?.inside && s?.state === 'idle') {
    e.summon = { session:s.id, since:s.stateSince, at:Date.now() }
    e.popAt = performance.now()
  }
  showCard(id)
}

function showCard(id) {
  const acc = snapshot.accounts.find(a => a.id === id), e = emps.get(id)
  if (!acc || !e) { card.hidden = true; cardFor = null; return }
  cardFor = id
  const s = sessionOf(acc), online = !!s && s.state !== 'ended'
  card.querySelector('h2').textContent = acc.name
  const rows = [['seat', t('card.seatNo', { n:acc.seat + 1 })], ['state', stateLine(e)], ['model', online ? buildText(s) : ''],
    ['tool', online ? s.tool : ''], ['dir', s?.cwd || acc.last?.dir], ['prompt', online ? s.prompt : ''], ['tools', online ? s.tools : ''],
    ['subagents', online ? Object.keys(s.agents || {}).length || '' : ''], ['terminal', online ? attachText(s.attach) : ''],
    ['login', s?.login], ['session', online ? s.id : '']]
  card.querySelector('dl').innerHTML = rows.filter(r => r[1] !== undefined && r[1] !== '' && r[1] !== null)
    .map(([k, v]) => `<dt>${esc(t('card.' + k))}</dt><dd${k === 'state' ? ' class="state-line"' : ''}>${esc(v)}</dd>`).join('')
  const btns = card.querySelector('.btns')
  btns.innerHTML = ''
  const add = (text, cls, fn) => { const b = document.createElement('button'); b.className = 'px ' + cls; b.textContent = text; b.onclick = fn; btns.appendChild(b) }
  if (online && s.state === 'waiting') add(t('card.handle'), 'alert', () => openAsks(s.id))
  if (!online && launchOpts?.enabled) add(t('launch.go'), 'primary go-work', () => openLaunch(acc.id))
  if (!online) add(t('card.delete'), '', async () => {
    if (!confirm(t('card.deleteConfirm', { name:acc.name }))) return
    const r = await fetch(`/api/accounts/${acc.id}`, { method:'DELETE' })
    if (!r.ok) alert(t('card.deleteFailed', { reason:errorText(await r.json().catch(() => null)) }))
    card.hidden = true; cardFor = null
  })
  const mine = snapshot.messages.filter(m => m.fromName === acc.name || m.toName === acc.name)
  card.querySelector('.msgs').innerHTML = mine.slice(-10).reverse().map(msgHTML).join('') || `<div class="msg">${esc(t('card.noMessages'))}</div>`
  card.hidden = false
}
// the status line of an open card follows what the employee is doing
function refreshCardLine() {
  const e = cardFor && !card.hidden && emps.get(cardFor), dd = e && card.querySelector('dd.state-line')
  if (dd && dd.textContent !== stateLine(e)) dd.textContent = stateLine(e)
}

// a click on a character, or else on a desk, is a click on that employee
cv.addEventListener('click', ev => {
  const x = (ev.clientX * dpr - offX) / S, y = (ev.clientY * dpr - offY) / S
  const list = [...emps.values()].filter(e => e.desk)
  const hit = list.find(e => {
    const b = build(e.s)
    return e.inside && x >= e.x - b.bw / 2 - 3 && x < e.x + b.bw / 2 + 3 && y >= e.y - b.bh - 4 && y < e.y + 2
  }) || list.find(e => x >= e.desk.x && x < e.desk.x + 32 && y >= e.desk.y - 15 && y < e.desk.y + 16)
  if (hit) onEmployeeClick(hit.acc.id)
})

// ================= starting sessions from the page =================
const dlg = document.getElementById('launch'), form = dlg.querySelector('form')
const field = name => form.elements[name]
let pendingLaunch = null // the launch we're waiting to see online
let launchAccount = null // the existing employee going back to work; null for a new one

async function loadLaunchOptions() {
  try { launchOpts = await (await fetch('/api/launch/options')).json() } catch { launchOpts = null }
  document.getElementById('new-emp').hidden = !launchOpts?.enabled
  // when starting isn't possible, say why; for a missing mod show the install command (reload after installing)
  const note = document.getElementById('launch-note')
  note.hidden = !launchOpts || launchOpts.enabled
  if (!note.hidden) {
    const fix = launchOpts.mod?.fix
    note.innerHTML = esc(t(fix ? 'launch.offWithFix' : 'launch.off', { reason:launchOffReason() })) + (fix ? `<code>${esc(fix)}</code>` : '')
  }
  layout()
}

// why the page can't start sessions: the mod's problem, or no launcher at all
const launchOffReason = () => launchOpts?.mod ? errorText(launchOpts.mod) : t('error.launch_disabled')

// labels of the drop-downs, in this page's language; model names and effort levels stay as they are
const optionLabel = {
  model:o => o.value ? o.label : t('option.default'),
  effort:o => o.value || t('option.default'),
  permissionMode:o => o.value ? o.value + t('common.colon') + t('option.permission.' + o.value) : t('option.default'),
  resume:o => t(o.value ? 'option.resume.' + o.value : 'option.resume.new'),
}
const fill = (select, options, value) => {
  select.innerHTML = options.map(o => `<option value="${esc(o.value)}">${esc(optionLabel[select.name](o))}</option>`).join('')
  select.value = value ?? ''
}

async function openLaunch(accountId) {
  await loadLaunchOptions()
  if (!launchOpts?.enabled) return alert(launchOpts ? launchOffReason() : t('error.unreachable'))
  const acc = accountId ? snapshot.accounts.find(a => a.id === accountId) : null
  launchAccount = acc ? acc.id : null
  const last = acc?.last || {}
  form.querySelector('.title').textContent = acc ? t('launch.titleExisting', { name:acc.name }) : t('launch.titleNew')
  field('name').value = acc ? acc.name : ''
  field('name').readOnly = !!acc
  const recent = launchOpts.recentDirs || []
  field('dir').value = last.dir || recent[0] || launchOpts.home || ''
  fill(field('model'), launchOpts.models, last.model)
  fill(field('effort'), launchOpts.efforts, last.effort)
  fill(field('permissionMode'), launchOpts.permissionModes, last.permissionMode)
  fill(field('resume'), launchOpts.resumes, '')
  form.querySelector('.recent').innerHTML = recent.map(d => `<span title="${esc(d)}">${esc(base(d))}</span>`).join('')
  form.querySelectorAll('.recent span').forEach((el, i) => el.onclick = () => { field('dir').value = recent[i]; preview() })
  form.querySelector('.browser').hidden = true
  setStatus('')
  form.querySelector('.go').disabled = false
  pendingLaunch = null
  preview()
  asksModal.hidden = true
  card.hidden = true; cardFor = null
  dlg.hidden = false
  ;(acc ? field('dir') : field('name')).focus()
}

function closeLaunch() { dlg.hidden = true; pendingLaunch = null; if (snapshot.asks.length) openAsks() }
function setStatus(text, err) {
  const el = form.querySelector('.status')
  el.textContent = text
  el.className = 'status' + (err ? ' err' : '')
}
function request() {
  const r = { dir:field('dir').value.trim(), model:field('model').value, effort:field('effort').value,
    permissionMode:field('permissionMode').value, resume:field('resume').value, lang }
  if (launchAccount) r.account = launchAccount
  else r.name = field('name').value.trim()
  return r
}

// command preview: the same arguments the bridge builds (it adds the environment variables, and --plugin-dir in development mode)
function preview() {
  const r = request()
  const q = s => /^[\w\-./=:@]+$/.test(s) ? s : `'${s.replace(/'/g, `'\\''`)}'`
  const args = ['claude', '--name', q(field('name').value.trim() || '?')]
  if (r.model) args.push('--model', r.model)
  if (r.effort) args.push('--effort', r.effort)
  if (r.permissionMode) args.push('--permission-mode', r.permissionMode)
  if (r.resume === 'continue') args.push('--continue')
  const note = t(launchOpts?.mod?.dev ? 'launch.previewNoteDev' : 'launch.previewNote')
  form.querySelector('.preview').textContent = `cd ${q(r.dir || '?')}\n${args.join(' ')}\n# ${note}`
}

async function browse(path) {
  const box = form.querySelector('.browser')
  try {
    const res = await fetch('/api/dirs?path=' + encodeURIComponent(path || launchOpts.home))
    const data = await res.json()
    if (!res.ok) throw new Error(errorText(data))
    box.hidden = false
    box.dataset.path = data.path
    box.querySelector('.cur').textContent = data.path
    // the bridge builds the paths, so the page never deals with / or \; at the top it lists the drives (Windows)
    const up = data.parent ? [['⬆ ' + t('launch.up'), data.parent]] : (data.roots || []).filter(r => r !== data.path).map(r => ['💽 ' + r, r])
    const items = up.concat((data.dirs || []).map(d => [d.name + '/', d.path]))
    const ul = box.querySelector('ul')
    ul.innerHTML = items.map(([label]) => `<li>${esc(label)}</li>`).join('') || `<li style="color:#8a867e;cursor:default">${esc(t('launch.noSubfolders'))}</li>`
    ul.querySelectorAll('li').forEach((li, i) => { if (items[i]) li.onclick = () => browse(items[i][1]) })
  } catch (err) {
    setStatus(t('launch.browseFailed', { reason:err.message }), true)
  }
}

form.addEventListener('input', preview)
form.addEventListener('change', preview)
form.querySelector('.browse').onclick = () => browse(field('dir').value.trim())
form.querySelector('.pick').onclick = () => {
  field('dir').value = form.querySelector('.browser').dataset.path
  form.querySelector('.browser').hidden = true
  preview()
}
form.querySelector('.cancel').onclick = closeLaunch
dlg.addEventListener('click', ev => { if (ev.target === dlg) closeLaunch() })
document.getElementById('new-emp').onclick = () => openLaunch(null)

form.addEventListener('submit', async ev => {
  ev.preventDefault()
  const r = request()
  if (!launchAccount && !r.name) return setStatus(t('launch.nameRequired'), true)
  form.querySelector('.go').disabled = true
  setStatus(t('launch.starting'))
  try {
    const res = await fetch('/api/launch', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(r) })
    const data = await res.json()
    if (!res.ok) throw new Error(errorText(data) + (data.fix ? '\n' + data.fix : ''))
    pendingLaunch = data.id
    setStatus(launchOpts.trustHint
      ? t('launch.waitingWindow')
      : t('launch.startingIn', { where:attachText(data.attach) }))
    watchLaunch()
  } catch (err) {
    setStatus(t('launch.failed', { reason:err.message }), true)
    form.querySelector('.go').disabled = false
  }
})

// follows the launch in the snapshot: closes the dialog once it's online, shows the reason if it failed
function watchLaunch() {
  if (!pendingLaunch) return
  const l = (snapshot.launches || []).find(x => x.id === pendingLaunch)
  if (!l) return
  if (l.status === 'online') {
    log(t('log.started', { name:l.name, where:attachText(l.attach) }))
    closeLaunch()
  } else if (l.status === 'failed') {
    setStatus(t('launch.failed', { reason:errorText({ code:l.errorCode, params:l.errorParams, error:l.error }) }), true)
    form.querySelector('.go').disabled = false
    pendingLaunch = null
  }
}

// ================= start-up =================
// room signs and the company sign's lettering, drawn with web fonts (clearer than pixel fonts in every script)
const roomEls = {}
for (const [key, text] of [['work', t('room.work')], ['meeting', t('room.meeting')], ['lounge', t('room.lounge')], ['front', t('room.front')], ['sign', 'SYMPHONY']]) {
  const el = document.createElement('div')
  el.className = key === 'sign' ? 'sign-text' : 'room-label'
  el.textContent = text
  document.getElementById('labels').appendChild(el)
  roomEls[key] = el
}
rooms.sign = {}
const addBtn = document.createElement('button')
addBtn.className = 'seat-add'
addBtn.textContent = '+'
addBtn.title = t('office.addSeatTitle')
addBtn.hidden = true
addBtn.addEventListener('click', () => openLaunch(null))
document.getElementById('labels').appendChild(addBtn)

layout()
loadLaunchOptions()
fetch('/api/state').then(r => r.json()).then(s => { if (first) applySnapshot(s) }).catch(() => {})
const es = new EventSource('/api/stream')
es.onmessage = m => {
  const msg = JSON.parse(m.data)
  if (msg.type === 'snapshot') applySnapshot(msg)
  else if (msg.type === 'event') applyEvent(msg.event, msg.title)
}
addEventListener('resize', layout)
requestAnimationFrame(frame)
</script>
</body>
