<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="approve.title">Symphony Approvals</title>
<style>
  :root { --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f7f6f3; color:#2b2a28; font:14px/1.5 system-ui, sans-serif; }
  /* CJK fonts per language, so each gets its own glyph forms */
  body:lang(zh-CN) { font-family:system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  body:lang(zh-TW) { font-family:system-ui, "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif; }
  body:lang(ja) { font-family:system-ui, "Hiragino Sans", "Yu Gothic UI", "Noto Sans CJK JP", sans-serif; }
  body:lang(ko) { font-family:system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", sans-serif; }
  header select.lang { font:inherit; font-size:12px; border:1px solid #dcd8d0; border-radius:4px; background:#fff; color:#2b2a28; padding:2px 4px; }
  header { padding:14px 18px; border-bottom:1px solid #e2dfd8; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; background:#fff; }
  header h1 { font-size:15px; font-weight:600; margin:0; }
  #status, #filter { color:#8a867e; font-size:12px; }
  header nav { margin-left:auto; }
  a { color:#2b2a28; }
  main { padding:16px; display:grid; gap:10px; max-width:820px; margin:0 auto; }
  .empty { color:#8a867e; text-align:center; padding:40px 0; }
  .card { background:#fff; border:1px solid #e2dfd8; border-radius:6px; padding:12px 14px; }
  .who { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
  .who .name { font-weight:600; }
  .who .dept, .who .kind, .meta { color:#8a867e; font-size:12px; }
  .tool { font:600 13px var(--mono); }
  pre { background:#f7f6f3; border:1px solid #ece9e3; border-radius:4px; padding:8px; overflow:auto; max-height:220px; margin:8px 0; white-space:pre-wrap; word-break:break-all; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  button { border:1px solid #2b2a28; border-radius:4px; padding:5px 14px; font:inherit; cursor:pointer; background:#fff; color:#2b2a28; }
  button.allow, button.submit { background:#2b2a28; color:#fff; }
  input[type=text] { flex:1; min-width:160px; background:#fff; border:1px solid #dcd8d0; color:#2b2a28; border-radius:4px; padding:5px 8px; font:inherit; }
  .q { margin:8px 0; } .q h3 { margin:0 0 2px; font-size:14px; font-weight:600; }
  .q .hd { color:#8a867e; font-weight:400; font-size:12px; margin-right:6px; }
  label.opt { display:block; padding:2px 0; cursor:pointer; } label.opt small { color:#8a867e; margin-left:6px; }
  .q input.other { display:block; width:100%; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="approve.title"></h1><span id="status" data-i18n="approve.connecting"></span><span id="filter"></span>
  <nav><a href="/" data-i18n="approve.office"></a></nav>
</header>
<main id="list"><div class="empty" data-i18n="approve.empty"></div></main>
<script type="module" src="/approve.js"></script>
</body>
</html>
