<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symphony 审批台</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#f7f6f3; color:#2b2a28; font:14px/1.5 system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid #e2dfd8; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; background:#fff; }
  header h1 { font-size:15px; font-weight:600; margin:0; }
  #status, #filter { color:#8a867e; font-size:12px; }
  header nav { margin-left:auto; }
  a { color:#2b2a28; }
  main { padding:16px; display:grid; gap:10px; max-width:820px; margin:0 auto; }
  .empty { color:#8a867e; text-align:center; padding:40px 0; }
  .card { background:#fff; border:1px solid #e2dfd8; border-radius:6px; padding:12px 14px; }
  .who { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
  .who .name { font-weight:600; }
  .who .dept, .who .kind, .meta { color:#8a867e; font-size:12px; }
  .tool { font:600 13px ui-monospace, monospace; }
  pre { background:#f7f6f3; border:1px solid #ece9e3; border-radius:4px; padding:8px; overflow:auto; max-height:220px; margin:8px 0; white-space:pre-wrap; word-break:break-all; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  button { border:1px solid #2b2a28; border-radius:4px; padding:5px 14px; font:inherit; cursor:pointer; background:#fff; color:#2b2a28; }
  button.allow, button.submit { background:#2b2a28; color:#fff; }
  input[type=text] { flex:1; min-width:160px; background:#fff; border:1px solid #dcd8d0; color:#2b2a28; border-radius:4px; padding:5px 8px; font:inherit; }
  .q { margin:8px 0; } .q h3 { margin:0 0 2px; font-size:14px; font-weight:600; }
  .q .hd { color:#8a867e; font-weight:400; font-size:12px; margin-right:6px; }
  label.opt { display:block; padding:2px 0; cursor:pointer; } label.opt small { color:#8a867e; margin-left:6px; }
  .q input.other { display:block; width:100%; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>Symphony 审批台</h1><span id="status">连接中…</span><span id="filter"></span>
  <nav><a href="/">办公室</a></nav>
</header>
<main id="list"><div class="empty">暂无待处理事项</div></main>
<script type="module">
import { esc, syncCards } from '/asks.js'

const list = document.getElementById('list')
const statusEl = document.getElementById('status')
const onlySession = new URLSearchParams(location.search).get('session')
let sessions = new Map(), accounts = new Map()

if (onlySession) document.getElementById('filter').innerHTML = `只看一个会话 · <a href="/approve">看全部</a>`

const who = a => {
  const name = accounts.get(a.account)?.name ?? sessions.get(a.session)?.title ?? a.session.slice(0, 6)
  return `<div class="who"><span class="name">${esc(name)}</span>
    <span class="kind">${a.agentId ? '子代理 ' + esc(a.agentId.slice(0, 6)) + ' · ' : ''}${a.kind === 'question' ? '提问' : '权限审批'}</span></div>`
}

function render(snap) {
  sessions = new Map(snap.sessions.map(s => [s.id, s]))
  accounts = new Map(snap.accounts.map(a => [a.id, a]))
  const asks = snap.asks.filter(a => !onlySession || a.session === onlySession)
  syncCards(list, asks, who, '<div class="empty">暂无待处理事项</div>')
  document.title = asks.length ? `(${asks.length}) Symphony 审批台` : 'Symphony 审批台'
}

fetch('/api/state').then(r => r.json()).then(render).catch(() => {})
const es = new EventSource('/api/stream')
es.onopen = () => statusEl.textContent = '已连接'
es.onerror = () => statusEl.textContent = '断开，重连中…'
es.onmessage = m => {
  const msg = JSON.parse(m.data)
  if (msg.type === 'snapshot') render(msg)
}
</script>
</body>
</html>
