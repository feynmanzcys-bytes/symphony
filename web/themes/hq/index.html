<!doctype html>
<html lang="en" data-theme="hq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="hq.title">Symphony HQ</title>
<link rel="stylesheet" href="/ui/ui.css">
<link rel="stylesheet" href="/t/hq/hq.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><h1 data-i18n="hq.title"></h1></div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview" data-i18n="hq.tab.overview"></button>
    <button data-tab="people" data-i18n="hq.tab.people"></button>
    <button data-tab="approvals"><span data-i18n="hq.tab.approvals"></span><b class="count" hidden></b></button>
    <button data-tab="projects"><span data-i18n="hq.tab.projects"></span><b class="count" hidden></b></button>
    <button data-tab="activity" data-i18n="hq.tab.activity"></button>
  </nav>
  <div class="find"><input id="find" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="hq.search"><div id="find-list" hidden></div></div>
  <div class="actions">
    <button class="px primary" id="new-emp" data-i18n="office.newEmployee" hidden></button>
    <button class="px" id="new-task" data-i18n="office.newTask" hidden></button>
    <button class="px icon" id="dark" data-i18n-title="hq.dark"></button>
    <div class="prefs"></div>
  </div>
</header>
<div class="note" id="launch-note" hidden></div>
<div class="kpis" id="kpis"></div>
<main id="main">
  <section data-tab="overview" class="overview">
    <div class="grid">
      <div class="card"><h2 data-i18n="hq.overview.waiting"></h2><div id="ov-waiting" class="list"></div></div>
      <div class="card"><h2 data-i18n="hq.overview.activityPerMinute"></h2><div id="ov-spark" class="chart"></div></div>
      <div class="card"><h2 data-i18n="hq.overview.costToday"></h2><div id="ov-cost" class="chart"></div></div>
      <div class="card"><h2 data-i18n="hq.overview.tokensByModel"></h2><div id="ov-tokens" class="chart"></div></div>
      <div class="card wide"><h2 data-i18n="hq.overview.recent"></h2><div id="ov-recent" class="list"></div></div>
    </div>
  </section>
  <section data-tab="people" class="people" hidden>
    <div class="toolbar"><div class="chips" id="chips"></div></div>
    <table id="people"><thead><tr></tr></thead><tbody></tbody></table>
    <div class="empty" id="people-empty" data-i18n="hq.empty.people" hidden></div>
  </section>
  <section data-tab="approvals" class="approvals" hidden>
    <div id="queue"></div>
  </section>
  <section data-tab="projects" class="projects" hidden>
    <div class="board" id="board"></div>
  </section>
  <section data-tab="activity" class="activity" hidden>
    <div class="toolbar"><select id="act-who"></select><select id="act-kind"></select></div>
    <div id="act-list" class="list"></div>
  </section>
</main>
<script type="module" src="/t/hq/hq.js"></script>
</body>
</html>
